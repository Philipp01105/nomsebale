name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Run tests
      run: go test -v ./...

    - name: Build binaries
      run: |
        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -o noms-linux-amd64 cmd/main.go
        
        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -o noms-linux-arm64 cmd/main.go
        
        # macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -o noms-darwin-amd64 cmd/main.go
        
        # macOS ARM64 (Apple Silicon)
        GOOS=darwin GOARCH=arm64 go build -o noms-darwin-arm64 cmd/main.go
        
        # Windows AMD64
        GOOS=windows GOARCH=amd64 go build -o noms-windows-amd64.exe cmd/main.go

    - name: Create checksums
      run: |
        sha256sum noms-* > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          noms-linux-amd64
          noms-linux-arm64
          noms-darwin-amd64
          noms-darwin-arm64
          noms-windows-amd64.exe
          checksums.txt
        draft: false
        prerelease: false
        generate_release_notes: true
